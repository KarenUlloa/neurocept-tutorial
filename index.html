<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurocept Model Re-training Tutorial</title>
<style>
  :root {
    --bg: #FFFFFF;
    --text: #1A1A1A;
    --muted: #666666;
    --border: #E0E0E0;
    --accent: #007AC9;
    --overlay: rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1C1C;
      --text: #F0F0F0;
      --muted: #A0A0A0;
      --border: #333333;
      --accent: #3FA9F5;
      --overlay: rgba(0,0,0,0.7);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #iframe-container {
    width: 100%;
    height: 100vh;
  }
  #iframe-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
    max-width: 480px;
    width: 90%;
    text-align: center;
  }
  .modal h2 {
    margin: 0 0 8px 0;
    font-size: 18px;
  }
  .modal p {
    margin: 0 0 24px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .modal-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal-options button {
    font-family: inherit;
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    text-align: left;
  }
  .modal-options button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>

<div id="iframe-container"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>How would you like to view this tutorial?</h2>
    <p>Choose a format to get started.</p>
    <div class="modal-options">
      <button data-format="slide">Step by step</button>
      <button data-format="scroll">Scrollable</button>
      <button data-format="video">Video</button>
    </div>
  </div>
</div>

<script>
  var SCRIBE_BASE = "https://scribehow.com/embed/Retraining_and_Deploying_Neurocept_Models_Using_Jupyter_Notebook__4l-K6FMsSu63WyCswdc9uA";

  var FORMATS = {
    slide: SCRIBE_BASE + "?removeLogo=true",
    scroll: SCRIBE_BASE + "?removeLogo=true&as=scrollable",
    video: SCRIBE_BASE + "?scaleMode=cover&removeLogo=true&as=video"
  };

  var buttons = document.querySelectorAll(".modal-options button");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener("click", function () {
      var fmt = this.getAttribute("data-format");
      var src = FORMATS[fmt];
      if (!src) return;
      document.getElementById("iframe-container").innerHTML =
        '<iframe src="' + src + '" allow="fullscreen"></iframe>';
      document.getElementById("modal-overlay").classList.add("hidden");
    });
  }
</script>

</body>
</html>
